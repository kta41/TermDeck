format = """
 $directory\
 $git_branch\
 $git_status\
 $kubernetes\
 $python\
 $nodejs\
 $rust\
 $cmd_duration\
 $line_break\
 $time\
 $username\
 $character"""

# Blank line between prompts, breathes better
add_newline = true

[directory]
# Show at most 3 levels: ~/dev/dotfiles instead of the full path
truncation_length = 3

[git_branch]
symbol = " "

# Branches with pending changes
[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "[*${count}](yellow)"

[cmd_duration]
# Show how long the command took when over 2s
min_time = 2000

[time]
disabled = false
format = '\[[$time]($style)\] '
time_format = '%H:%M'
style = "#9399b2"   # subtle Catppuccin grey

[username]
show_always = true          # by default only shown on SSH/root
style_user = "bold #89b4fa" # Catppuccin blue; pick your own
format = "[$user ]($style)"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"

# Current k8s context: reads the kubeconfig only, no API calls → fast and safe.
# Context/namespace only; cluster health is rendered by WezTerm (right status).
[kubernetes]
disabled = false
symbol = "☸ "
style = "bold #89b4fa"
format = '[$symbol$context( · $namespace)]($style) '