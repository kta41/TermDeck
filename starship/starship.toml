format = """
 $directory\
 $git_branch\
 $git_status\
 $kubernetes\
 $python\
 $nodejs\
 $rust\
 $cmd_duration\
 $line_break\
 $time\
 $username\
 $character"""

# Línea en blanco entre prompts, respira mejor
add_newline = true

[directory]
# Muestra máximo 3 niveles: ~/dev/dotfiles en vez de ruta completa
truncation_length = 3

[git_branch]
symbol = " "

# Ramas con cambios pendientes
[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "[*${count}](yellow)"

[cmd_duration]
# Muestra cuánto tardó el comando si pasó de 2s
min_time = 2000

[time]
disabled = false
format = '\[[$time]($style)\] '
time_format = '%H:%M'
style = "#9399b2"   # gris sutil Catppuccin

[username]
show_always = true          # por defecto solo se muestra en SSH/root
style_user = "bold #89b4fa" # azul Catppuccin; pon el que quieras
format = "[$user ]($style)"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"

# Contexto k8s actual: lee el kubeconfig, sin llamadas al API → rápido y seguro.
# Solo contexto/namespace; la salud del clúster la pinta WezTerm (status derecho).
[kubernetes]
disabled = false
symbol = "☸ "
style = "bold #89b4fa"
format = '[$symbol$context( · $namespace)]($style) '